name: VelKoth
version: "${version}"
main: dev.velmax.velkoth.VelKothPlugin
description: "${description}"
author: VelMax Studios
api-version: "26.2"
folia-supported: true

dependencies:
  server:
    Vault:
      load: BEFORE
      required: false
    PlaceholderAPI:
      load: BEFORE
      required: false
    BetterTeams:
      load: BEFORE
      required: false
    Factions:
      load: BEFORE
      required: false
    # FactionsUUID 4.x (dev.kitteh API). join-classpath exposes its classes to the reflective team hook.
    FactionsUUID:
      load: BEFORE
      required: false
      join-classpath: true
    GangsPlus:
      load: BEFORE
      required: false
    Guilds:
      load: BEFORE
      required: false
    Kingdoms:
      load: BEFORE
      required: false
    SuperiorSkyblock2:
      load: BEFORE
      required: false
    Towny:
      load: BEFORE
      required: false
    UltimateClans:
      load: BEFORE
      required: false
    Parties:
      load: BEFORE
      required: false
    AxParties:
      load: BEFORE
      required: false
    LandClaimPlugin:
      load: BEFORE
      required: false
    # TAB must be enabled first and visible on the classpath so its scoreboard can be paused during events.
    TAB:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  velkoth.admin:
    description: Full administrative access to VelKoth
    default: op
  velkoth.use:
    description: Basic VelKoth usage
    default: true
